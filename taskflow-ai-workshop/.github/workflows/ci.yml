name: TaskFlow CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn --batch-mode test
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Playwright dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Package app
        run: mvn --batch-mode package -DskipTests
      - name: Start app and run browser tests
        shell: bash
        run: |
          java -jar target/taskflow-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/tasks >/dev/null; then break; fi
            sleep 2
          done
          npm run test:e2e
