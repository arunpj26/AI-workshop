spring.application.name=taskflow
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
server.error.include-message=always
taskflow.user.name=${TASKFLOW_USER_NAME:}
taskflow.user.role=${TASKFLOW_USER_ROLE:}
taskflow.user.image-url=${TASKFLOW_USER_IMAGE_URL:}
